# legoESM ICON lane: the APE_AES aquaplanet with a legoESM slab-land patch (0-45 N, 0-60 E), R02B04.
# Every setting explicit: the ICON blocks are APE_AES's, the land block is legoESM's slab defaults
# with SimpleSEB. Refused until the lane has radiation (step 3.x), unless the patch holds no cell.
# The grid file is machine-specific:
#   legoesm run config/icon/ape_aes_land_r2b4.yaml --set grid.grid_file=<path to icon_grid_0013_R02B04_R.nc>
model:
  name: Aquaplanet with ICON AES physics and a slab-land patch, R02B04
