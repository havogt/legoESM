  n_levels: 35
atmosphere:
  dynamics: nonhydrostatic
  discretization: icon
  dt_seconds: 300.0
  icon_spmd: true
  icon_finite_halo_padding: false
time:
  duration_hours: 24
  start_year: 2008
  start_day: 244.0
  output_interval_hours: 24
output:
  path: output/ape_aes_land_r2b4
  checkpoint_days: 0
hardware:
